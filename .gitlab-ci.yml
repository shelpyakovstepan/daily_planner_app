stages:
  - build
  - test
  - linttest
  - deploy
  - cleanup

build-job:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker compose .

unit-test-job:
  stage: test
  image: docker:24.0
  services:
    - docker:24.0-dind
    - rabbitmq:latest
  script:
    - docker compose build
    - echo "$ENV_FILE" > .env
    - docker run --rm --env-file .env daily_planner_image pytest -s -v

lint-test-job:
  stage: linttest
  script:
    - echo "Проверка форматирования с помощью black..."
    - docker exec -it daily_planner black --config .black --check .
    - echo "Статическая проверка типов с помощью pyright..."
    - docker exec -it daily_planner pyright .
    - echo  "Запуск flake8..."
    - docker exec -it daily_planner flake8 .
    - echo "Проверка порядка импортов с помощью isort..."
    - docker exec -it daily_planner isort --check-only .
    - docker daily_planner_image

deploy-job:
  stage: deploy
  script:
    - docker compose up -d

cleanup-job:
  stage: cleanup
  script:
    - docker compose down -d