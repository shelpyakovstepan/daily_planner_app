stages:
  - build
  - test
  - linttest
  - deploy
  - cleanup

build-job:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "$ENV_NON_DEV" > .env-non-dev
    - docker compose build
    - rm -f .env-non-dev

unit-test-job:
  stage: test
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "$ENV_TEST" > .env-non-dev
    - docker compose run daily_planner pytest -s -v
    - rm -f .env-non-dev

lint-test-job:
  stage: linttest
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "$ENV_NON_DEV" > .env-non-dev
    - echo "Проверка форматирования с помощью black..."
    - docker compose exec -it daily_planner black --config .black --check .
    - echo "Статическая проверка типов с помощью pyright..."
    - docker compose exec -it daily_planner pyright .
    - echo  "Запуск flake8..."
    - docker compose exec -it daily_planner flake8 .
    - echo "Проверка порядка импортов с помощью isort..."
    - docker compose exec -it daily_planner isort --check-only .
    - docker compose rm daily_planner

deploy-job:
  stage: deploy
  script:
    - docker compose up -d

cleanup-job:
  stage: cleanup
  script:
    - docker compose down -d