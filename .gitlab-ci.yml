build-job:
  stage: build
  script:
    - docker compose -f docker-compose.yaml build

run-job:
  stage: run
  needs: [build-job]
  script:
    - docker compose -f docker-compose.yaml up -d

lint-test-job:
  stage: lint
  needs: [run-job]
  script:
    - echo "Проверка форматирования с помощью black..."
    - docker exec -it daily_planner_app black --config .black --check .
    #- docker compose -f docker-compose.yaml exec daily_planner black --check --diff --config .black app tests
    - echo "Статическая проверка типов с помощью pyright..."
    - docker exec daily_planner_app pyright .
    - echo  "Запуск flake8..."
    - docker exec daily_planner_app flake8 .
    - echo "Проверка порядка импортов с помощью isort..."
    - docker exec daily_planner_app isort --check-only .


test-job:
  stage: test
  needs: [lint-test-job]
  script:
    - echo "Начало тестирования"
    - docker exec -e MODE=TEST daily_planner_app pytest -s -v


cleanup-job:
  stage: cleanup
  needs: [run-job]
  script:
    - docker compose -f docker-compose.yaml down
    - docker container prune -f
    - docker volume prune -f
    - docker system prune -f
  when: always


deploy-job:
  stage: deploy
  needs: [test-job]
  script:
    - docker compose -f docker-compose.yaml build
    - docker compose -f docker-compose.yaml up -d
  when: manual
