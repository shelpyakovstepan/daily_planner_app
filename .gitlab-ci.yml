stages:
  - build
  - run
  - lint
  - test
  - cleanup
  - deploy

before_script:
  - echo "$ENV_NON_DEV" > .env-non-dev
  - powershell -command "Get-Content -Encoding Unicode .env-non-dev | Out-File -Encoding utf8 .env-non-dev.utf8"
  - powershell -command "Move-Item -Force .env-non-dev.utf8 .env-non-dev"

after_script:
  - rm -Fo .env-non-dev


build-job:
  stage: build
  script:
    - docker compose -f docker-compose.yaml build

run-job:
  stage: run
  needs: [build-job]
  script:
    - docker compose -f docker-compose.yaml up -d

lint-test-job:
  stage: lint
  needs: [run-job]
  script:
    - echo "Проверка форматирования кода с помощью black..."
    - docker compose exec -it daily_planner black --config .black --check .

    - echo "Проверка типов с помощью pyright..."
    - docker compose exec -it daily_planner pyright .

    - echo "Проверка стиля кода с помощью flake8..."
    - docker compose exec -it daily_planner flake8 .

    - echo "Проверка сортировки импортов с помощью isort..."
    - docker compose exec -it daily_planner isort --check-only --diff .

test-job:
  stage: test
  needs: [lint-test-job]
  script:
    - echo "Начало тестирования"
    - docker compose exec -e MODE=TEST daily_planner pytest -s -v


cleanup-job:
  stage: cleanup
  needs: [run-job, test-job]
  script:
    - docker compose -f docker-compose.yaml down
    - docker container prune -f
    - docker volume prune -f
    - docker system prune -f
  when: always


deploy-job:
  stage: deploy
  needs: [test-job]
  script:
    - docker compose -f docker-compose.yaml build
    - docker compose -f docker-compose.yaml up -d
  when: manual
