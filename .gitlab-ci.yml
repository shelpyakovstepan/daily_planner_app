stages:
  - build
  - test
  - deploy
  - cleanup

image: docker:20.10.16

services:
  - docker:20.10.16-dind

build-job:
  stage: build
  script:
    - docker build -t daily-planner-image .

unit-test-job:
  stage: test
  script:
    - docker run daily-planner-image pytest -s -v

lint-test-job:
  stage: test
  script:
    - echo "Проверка форматирования с помощью black..."
    - docker exec -it daily_planner_image black --config .black --check .
    - echo "Статическая проверка типов с помощью pyright..."
    - docker exec -it daily_planner_image pyright .
    - echo  "Запуск flake8..."
    - docker exec -it daily_planner_image flake8 .
    - echo "Проверка порядка импортов с помощью isort..."
    - docker exec -it daily_planner_image isort --check-only .
    - docker daily_planner_image

deploy-job:
  stage: deploy
  script:
    - docker compose up -d

cleanup-job:
  stage: cleanup
  script:
    - docker compose down -d

