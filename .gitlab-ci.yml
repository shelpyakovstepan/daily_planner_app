stages:
  - build
  - test
  - linttest
  - deploy
  - cleanup

image: docker:20.10.16

services:
  - docker:20.10.16-dind

build-job:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker build -t daily_planner_image:latest .
    - docker run -d --name gitlab-ci-runner --restart always --privileged daily_planner_image
    - docker images

unit-test-job:
  stage: test
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker run daily_planner_image:latest pytest -s -v

lint-test-job:
  stage: linttest
  script:
    - echo "Проверка форматирования с помощью black..."
    - docker exec -it daily_planner black --config .black --check .
    - echo "Статическая проверка типов с помощью pyright..."
    - docker exec -it daily_planner pyright .
    - echo  "Запуск flake8..."
    - docker exec -it daily_planner flake8 .
    - echo "Проверка порядка импортов с помощью isort..."
    - docker exec -it daily_planner isort --check-only .
    - docker daily_planner_image

deploy-job:
  stage: deploy
  script:
    - docker compose up -d

cleanup-job:
  stage: cleanup
  script:
    - docker compose down -d

